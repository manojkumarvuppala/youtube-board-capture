<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; font-family: Arial, sans-serif; padding: 10px; text-align: center; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
    #startBtn { background: #4CAF50; color: white; }
    #stopBtn { background: #f44336; color: white; display: none; }
    #scanBtn { background: #9C27B0; color: white; }
    #manualBtn { background: #2196F3; color: white; }
    #downloadBtn { background: #FF9800; color: white; }
    #status { font-size: 12px; color: #555; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>Board Capture</h3>
  <div id="status">Status: Inactive</div>
  <button id="scanBtn">Fast Scan (No Playback)</button>
  <button id="startBtn">Watch & Auto-Capture</button>
  <button id="stopBtn">Stop Auto-Capture</button>
  <button id="manualBtn">Manual Snapshot</button>
  <button id="downloadBtn">Download PDF</button>
  <script src="popup.js"></script>
</body>
</html>
